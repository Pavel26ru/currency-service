syntax = "proto3";

import "google/protobuf/timestamp.proto";

package currency;

option go_package = "pkg/currency";

service CurrencyService {
  rpc GetRate(GetRateRequest) returns (GetRateResponse);
}

message GetRateRequest {
  string currency = 1;
  google.protobuf.Timestamp date_from = 2;
  google.protobuf.Timestamp date_to = 3;
}

message GetRateResponse {
  string currency = 1;
  repeated RateRecord rates = 2;
}

message RateRecord {
  google.protobuf.Timestamp date = 1;
  float rate = 2;
}

// Тип decimal
// https://github.com/googleapis/googleapis/blob/master/google/type/decimal.proto
// https://github.com/googleapis/googleapis/blob/master/google/type/money.proto

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
}